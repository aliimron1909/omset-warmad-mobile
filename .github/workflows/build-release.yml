name: Build Release APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK + NDK 28.2.13676358
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-35
            build-tools;35.0.0
            ndk;28.2.13676358

      - name: Setup Flutter 3.50.1 (x86_64 native)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true

      - name: Prepare signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "::error::ANDROID_KEYSTORE_BASE64 belum diisi"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/warmad-release.jks
          cat > android/key.properties <<EOF
          storeFile=app/warmad-release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Flutter pub get
        run: flutter pub get

      - name: Build arm64 release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Verify APK
        env:
          BUILD_TOOLS: ${{ env.ANDROID_SDK_ROOT }}/build-tools/35.0.0
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          "$BUILD_TOOLS/zipalign" -c -v 4 "$APK"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee apksigner.txt
          grep -q '9C:94:A7:4A:2E:73:A1:B0:C9:F2:33:02:75:83:76:B0:4B:99:0B:DC:6B:74:DF:91:84:E2:FC:AE:86:7C:2D:47' apksigner.txt

      - name: Rename artifact
        run: |
          VERSION=$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          cp build/app/outputs/flutter-apk/app-release.apk \
             "Omset-WarMad-v${VERSION}-arm64-release.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Omset-WarMad-arm64-release
          path: Omset-WarMad-v*-arm64-release.apk
          if-no-files-found: error
